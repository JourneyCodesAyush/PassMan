[project]
name = "passman"
version = "0.1.0"
description = "A simple password manager"
readme = "README.md"
authors = [
    { name = "JourneyCodesAyush", email = "journeycodes.ayush@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=49.0.0",
]

[project.scripts]
passman = "passman:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"
