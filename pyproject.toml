[project]
name = "passman"
version = "0.7.0"
description = "A local-first CLI password manager with Argon2 hashing and Fernet encryption"
readme = "README.md"
authors = [
    { name = "JourneyCodesAyush", email = "journeycodes.ayush@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=49.0.0",
    "jsonschema>=4.26.0",
]

[project.scripts]
passman = "passman.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
]
